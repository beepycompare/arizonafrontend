<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Перемещение на праздничную площадь</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            background: #000;
        }

        /* Весь эффект длится 10 секунд и проигрывается один раз.
   0.0–1.5 с   черный экран
   1.4–2.8 с   разлом раскрывается
   2.8–7.8 с   черная воронка вращается, затягивает пепел и угли, пульсирует как сердце
   7.8–8.8 с   воронка поглощает экран, остается чистый черный
   8.8–10 с    черный экран (остается черным после окончания), игрок уже на площади */

        .tp {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 9999;
            font-family: "Georgia", "Times New Roman", serif;
        }

        .tp * {
            box-sizing: border-box;
        }

        /* ---------- Тьма ---------- */
        .tp-veil {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
        }

        .tp-veil::before {
            /* тяжелый багровый туман */
            content: "";
            position: absolute;
            top: -20%;
            left: -20%;
            right: -20%;
            bottom: -20%;
            background:
                radial-gradient(circle at 28% 38%, rgba(110, 0, 8, .30), transparent 36%),
                radial-gradient(circle at 72% 64%, rgba(70, 0, 0, .35), transparent 40%),
                radial-gradient(circle at 50% 95%, rgba(140, 20, 0, .18), transparent 40%);
            opacity: 0;
            animation: tp-fog 7s ease-in-out infinite alternate, tp-atmo 10s ease forwards;
        }

        .tp-veil::after {
            /* глубокая виньетка */
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            box-shadow: inset 0 0 30vmin 12vmin #000;
        }

        /* туман и багровый отсвет есть только пока открыт разлом */
        @keyframes tp-atmo {

            0%,
            16% {
                opacity: 0;
            }

            26% {
                opacity: 1;
            }

            76% {
                opacity: 1;
            }

            84%,
            100% {
                opacity: 0;
            }
        }

        /* ---------- Разлом ---------- */
        .tp-stage {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 58vmin;
            height: 58vmin;
            margin: -33vmin 0 0 -29vmin;
            opacity: 0;
            transform: scale(0);
            animation: tp-stage 10s cubic-bezier(.5, 0, .3, 1) forwards;
        }

        .tp-portal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            animation: tp-heartbeat 1.4s ease-in-out infinite;
        }

        .tp-portal>div {
            position: absolute;
            border-radius: 50%;
        }

        /* кровавое зарево позади */
        .tp-glow {
            top: -22%;
            left: -22%;
            right: -22%;
            bottom: -22%;
            background: radial-gradient(circle closest-side, rgba(150, 0, 10, .55) 40%, rgba(60, 0, 0, .35) 65%, transparent 100%);
            animation: tp-glow 1.4s ease-in-out infinite;
        }

        /* кольцо: обертка дает свечение, внутренний слой — само кольцо */
        .tp-halo {
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .tp-halo--blur {
            filter: blur(1.8vmin);
            opacity: .85;
        }

        .tp-ring {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 50%;
            background: conic-gradient(#000, #5a0006, #d1000f, #2a0002, #000, #000, #8a0010, #ff3b1f, #3a0003, #000);
            -webkit-mask: radial-gradient(circle closest-side, transparent 84%, #000 86%, #000 95%, transparent 97%);
            mask: radial-gradient(circle closest-side, transparent 84%, #000 86%, #000 95%, transparent 97%);
            animation: tp-spin 4s linear infinite;
        }

        /* рваные «зубья» по краю */
        .tp-teeth {
            top: -3%;
            left: -3%;
            right: -3%;
            bottom: -3%;
            background: repeating-conic-gradient(#000 0deg, #000 5deg, transparent 6deg, transparent 13deg);
            -webkit-mask: radial-gradient(circle closest-side, transparent 88%, #000 90%, #000 100%);
            mask: radial-gradient(circle closest-side, transparent 88%, #000 90%, #000 100%);
            filter: drop-shadow(0 0 .6vmin rgba(200, 0, 15, .9));
            animation: tp-spin 20s linear infinite reverse;
        }

        .tp-dash {
            top: 4%;
            left: 4%;
            right: 4%;
            bottom: 4%;
            border: .4vmin dashed rgba(170, 0, 15, .7);
            animation: tp-spin 9s linear infinite reverse;
        }

        .tp-dots {
            top: -9%;
            left: -9%;
            right: -9%;
            bottom: -9%;
            border: .3vmin dotted rgba(120, 120, 120, .35);
            animation: tp-spin 18s linear infinite;
        }

        /* черный вихрь */
        .tp-vortex {
            top: 9%;
            left: 9%;
            right: 9%;
            bottom: 9%;
            background: repeating-conic-gradient(#000 0deg, #000 14deg, #4a0004 22deg, #b3000c 25deg, #000 34deg);
            -webkit-mask: radial-gradient(circle closest-side, #000 70%, transparent 100%);
            mask: radial-gradient(circle closest-side, #000 70%, transparent 100%);
            filter: blur(.6vmin);
            animation: tp-spin 2.4s linear infinite;
        }

        .tp-arms {
            top: 12%;
            left: 12%;
            right: 12%;
            bottom: 12%;
            background: conic-gradient(transparent 0deg, transparent 20deg, rgba(0, 0, 0, .95) 45deg, transparent 80deg,
                    transparent 120deg, rgba(160, 0, 12, .55) 150deg, transparent 185deg,
                    transparent 240deg, rgba(0, 0, 0, .95) 270deg, transparent 305deg, transparent 360deg);
            -webkit-mask: radial-gradient(circle closest-side, transparent 12%, #000 45%, transparent 100%);
            mask: radial-gradient(circle closest-side, transparent 12%, #000 45%, transparent 100%);
            animation: tp-spin 3s linear infinite reverse;
        }

        .tp-arms--2 {
            transform: rotate(60deg);
            animation-duration: 4.6s;
            animation-direction: normal;
            opacity: .8;
        }

        /* бездна в центре: абсолютная чернота с тлеющим краем */
        .tp-core {
            top: 26%;
            left: 26%;
            right: 26%;
            bottom: 26%;
            background: radial-gradient(circle closest-side, #000 0%, #000 52%, #1a0001 68%, rgba(200, 0, 15, .9) 88%, transparent 100%);
            box-shadow: 0 0 5vmin 1vmin rgba(120, 0, 8, .6), inset 0 0 4vmin 2vmin #000;
            animation: tp-core 1.4s ease-in-out infinite;
        }

        /* два красных «глаза» во тьме */
        .tp-eyes {
            top: 44%;
            left: 38%;
            right: 38%;
            bottom: 50%;
            border-radius: 0 !important;
            background:
                radial-gradient(ellipse 22% 60% at 22% 50%, #ff2a14 0%, rgba(255, 0, 0, .6) 40%, transparent 70%),
                radial-gradient(ellipse 22% 60% at 78% 50%, #ff2a14 0%, rgba(255, 0, 0, .6) 40%, transparent 70%);
            filter: blur(.15vmin) drop-shadow(0 0 1vmin #ff0000);
            opacity: 0;
            animation: tp-eyes 10s ease forwards;
        }

        /* пепел и угли, затягиваемые по спирали */
        .tp-particles {
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
        }

        .tp-particles i {
            position: absolute;
            width: .9vmin;
            height: .9vmin;
            margin: -.45vmin;
            border-radius: 50%;
            background: #ff3b1f;
            box-shadow: 0 0 1.4vmin #c80010;
            opacity: 0;
            animation: tp-suck var(--t) cubic-bezier(.55, 0, .9, .6) infinite;
            animation-delay: calc(2.2s + var(--dl));
            animation-fill-mode: backwards;
        }

        .tp-particles i:nth-child(3n) {
            background: #3a3a3a;
            box-shadow: 0 0 .6vmin #000;
            width: 1.2vmin;
            height: 1.2vmin;
        }

        .tp-particles i:nth-child(3n+1) {
            background: #7a0008;
            box-shadow: 0 0 1vmin #400;
            width: .6vmin;
            height: .6vmin;
        }

        /* ---------- Надпись ---------- */
        .tp-caption {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 5%;
            text-align: center;
            opacity: 0;
            animation: tp-caption 10s ease forwards;
        }

        .tp-sub {
            font-size: 1.7vmin;
            letter-spacing: 1vmin;
            text-transform: uppercase;
            color: #6b5a5a;
            margin-bottom: 1vmin;
        }

        .tp-title {
            font-size: 4.4vmin;
            font-weight: 700;
            letter-spacing: .6vmin;
            text-transform: uppercase;
            color: #b3000c;
            text-shadow: 0 0 .6vmin #000, 0 0 2vmin #6a0006, 0 .3vmin 0 #000;
            animation: tp-flicker 2.6s linear infinite;
        }

        .tp-bar {
            width: 36vmin;
            height: .4vmin;
            margin: 2.2vmin auto 0;
            background: rgba(255, 255, 255, .06);
            overflow: hidden;
        }

        .tp-bar i {
            display: block;
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, #1a0001, #c8000f);
            box-shadow: 0 0 1vmin #a0000c;
            animation: tp-load 10s linear forwards;
        }

        /* ---------- Вспышка ---------- */
        .tp-flash {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            opacity: 0;
            animation: tp-flash 10s ease forwards;
        }

        /* ---------- Ключевые кадры (таймлайн 10 с) ---------- */
        @keyframes tp-stage {

            0%,
            14% {
                opacity: 0;
                transform: scale(0) rotate(-120deg);
            }

            24% {
                opacity: 1;
                transform: scale(1.07) rotate(0deg);
            }

            28% {
                opacity: 1;
                transform: scale(1);
            }

            76% {
                opacity: 1;
                transform: scale(1);
            }

            80% {
                opacity: 1;
                transform: scale(.82) rotate(15deg);
            }

            88% {
                opacity: 1;
                transform: scale(7) rotate(-40deg);
            }

            93% {
                opacity: 0;
                transform: scale(9) rotate(-60deg);
            }

            100% {
                opacity: 0;
                transform: scale(9) rotate(-60deg);
            }
        }

        @keyframes tp-eyes {

            0%,
            40% {
                opacity: 0;
            }

            44% {
                opacity: 1;
            }

            47% {
                opacity: .15;
            }

            /* моргнул */
            49% {
                opacity: 1;
            }

            68% {
                opacity: 1;
            }

            74%,
            100% {
                opacity: 0;
            }
        }

        @keyframes tp-caption {

            0%,
            24% {
                opacity: 0;
                transform: translateY(2vmin);
            }

            31% {
                opacity: 1;
                transform: translateY(0);
            }

            76% {
                opacity: 1;
                transform: translateY(0);
            }

            81%,
            100% {
                opacity: 0;
                transform: translateY(-1vmin);
            }
        }

        @keyframes tp-load {

            0%,
            27% {
                width: 0;
            }

            78%,
            100% {
                width: 100%;
            }
        }

        @keyframes tp-flash {

            /* воронка поглощает экран — остается чистая чернота */
            0%,
            82% {
                opacity: 0;
            }

            88%,
            100% {
                opacity: 1;
            }
        }

        @keyframes tp-spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* двойной удар сердца */
        @keyframes tp-heartbeat {

            0%,
            40%,
            100% {
                transform: scale(1);
            }

            10% {
                transform: scale(1.05);
            }

            20% {
                transform: scale(1);
            }

            28% {
                transform: scale(1.035);
            }
        }

        @keyframes tp-glow {

            0%,
            40%,
            100% {
                opacity: .5;
                transform: scale(.95);
            }

            10% {
                opacity: 1;
                transform: scale(1.1);
            }

            28% {
                opacity: .85;
                transform: scale(1.04);
            }
        }

        @keyframes tp-core {

            0%,
            40%,
            100% {
                transform: scale(1);
            }

            10% {
                transform: scale(1.08);
            }

            28% {
                transform: scale(1.04);
            }
        }

        @keyframes tp-fog {
            from {
                transform: translate(-3%, -2%) scale(1);
            }

            to {
                transform: translate(3%, 2%) scale(1.12);
            }
        }

        @keyframes tp-suck {
            0% {
                opacity: 0;
                transform: rotate(var(--a)) translateX(52vmin) scale(1.5);
            }

            15% {
                opacity: 1;
            }

            85% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                transform: rotate(calc(var(--a) + 220deg)) translateX(0) scale(.2);
            }
        }

        @keyframes tp-flicker {

            0%,
            15%,
            19%,
            55%,
            58%,
            100% {
                opacity: 1;
            }

            17%,
            56% {
                opacity: .3;
            }
        }
    </style>
</head>

<body>

    <div class="tp">
        <div class="tp-veil"></div>

        <div class="tp-stage">
            <div class="tp-portal">
                <div class="tp-glow"></div>
                <div class="tp-dots"></div>
                <div class="tp-halo tp-halo--blur">
                    <div class="tp-ring"></div>
                </div>
                <div class="tp-halo">
                    <div class="tp-ring"></div>
                </div>
                <div class="tp-teeth"></div>
                <div class="tp-dash"></div>
                <div class="tp-vortex"></div>
                <div class="tp-arms"></div>
                <div class="tp-arms tp-arms--2"></div>
                <div class="tp-core"></div>
                <div class="tp-eyes"></div>
                <div class="tp-particles">
                    <i style="--a:0deg;   --t:1.8s; --dl:0s"></i>
                    <i style="--a:20deg;  --t:2.3s; --dl:.3s"></i>
                    <i style="--a:45deg;  --t:2.0s; --dl:.9s"></i>
                    <i style="--a:70deg;  --t:2.6s; --dl:.2s"></i>
                    <i style="--a:95deg;  --t:1.9s; --dl:1.1s"></i>
                    <i style="--a:120deg; --t:2.2s; --dl:.5s"></i>
                    <i style="--a:140deg; --t:2.5s; --dl:1.4s"></i>
                    <i style="--a:165deg; --t:2.1s; --dl:.1s"></i>
                    <i style="--a:190deg; --t:2.4s; --dl:.7s"></i>
                    <i style="--a:215deg; --t:1.8s; --dl:1.3s"></i>
                    <i style="--a:240deg; --t:2.7s; --dl:.4s"></i>
                    <i style="--a:260deg; --t:2.0s; --dl:1s"></i>
                    <i style="--a:285deg; --t:2.3s; --dl:.6s"></i>
                    <i style="--a:305deg; --t:1.9s; --dl:1.5s"></i>
                    <i style="--a:330deg; --t:2.5s; --dl:.25s"></i>
                    <i style="--a:350deg; --t:2.1s; --dl:.8s"></i>
                    <i style="--a:110deg; --t:2.8s; --dl:1.7s"></i>
                    <i style="--a:230deg; --t:2.2s; --dl:1.9s"></i>
                </div>
            </div>
        </div>

        <div class="tp-caption">
            <div class="tp-sub">Перемещение</div>
            <div class="tp-title">Праздничная площадь</div>
            <div class="tp-bar"><i></i></div>
        </div>

        <div class="tp-flash"></div>
    </div>

</body>

</html>

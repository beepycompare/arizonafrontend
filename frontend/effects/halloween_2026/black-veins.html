<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Черные вены</title>
    <style>
        /* Постоянный эффект: фон прозрачный, под эффектом видна игра.
   При появлении вены за 1.5 секунды проступают от краев экрана,
   затем бесконечно пульсируют двойным ударом сердца, пока блок .vn на странице.
   Чтобы убрать эффект, удалите блок .vn. */
        html,
        body {
            margin: 0;
            height: 100%;
            background: transparent;
        }

        .vn {
            --vein: #000;
            /* цвет вен */
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 9999;
            animation: vn-in 1.5s ease-out both;
        }

        /* затемнение по краям, как в примере, но черное */
        .vn-edge {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            box-shadow: inset 0 0 14vmin 2vmin rgba(0, 0, 0, .9), inset 0 0 4vmin 1vmin #000;
            animation: vn-edge 1.2s ease-in-out 1.5s infinite;
        }

        .vn-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .vn-svg path {
            fill: var(--vein);
        }

        /* размытая копия вен: темная «гематома» вокруг них */
        .vn-bruise {
            filter: blur(6px);
            opacity: .55;
            animation: vn-bruise 1.2s ease-in-out 1.5s infinite;
        }

        /* четкие вены */
        .vn-sharp {
            animation: vn-swell 1.2s ease-in-out 1.5s infinite;
        }

        @keyframes vn-in {
            from {
                opacity: 0;
                transform: scale(1.06);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* двойной удар сердца */
        @keyframes vn-swell {

            0%,
            45%,
            100% {
                opacity: .88;
                filter: drop-shadow(0 0 0 #000);
            }

            12% {
                opacity: 1;
                filter: drop-shadow(0 0 2.5px #000) drop-shadow(0 0 1px #000);
            }

            26% {
                opacity: .92;
                filter: drop-shadow(0 0 .5px #000);
            }

            34% {
                opacity: 1;
                filter: drop-shadow(0 0 1.8px #000);
            }
        }

        @keyframes vn-bruise {

            0%,
            45%,
            100% {
                opacity: .45;
            }

            12% {
                opacity: .8;
            }

            34% {
                opacity: .65;
            }
        }

        @keyframes vn-edge {

            0%,
            45%,
            100% {
                box-shadow: inset 0 0 14vmin 2vmin rgba(0, 0, 0, .9), inset 0 0 4vmin 1vmin #000;
            }

            12% {
                box-shadow: inset 0 0 20vmin 4vmin rgba(0, 0, 0, .95), inset 0 0 6vmin 2vmin #000;
            }

            34% {
                box-shadow: inset 0 0 17vmin 3vmin rgba(0, 0, 0, .92), inset 0 0 5vmin 1.5vmin #000;
            }
        }
    </style>
</head>

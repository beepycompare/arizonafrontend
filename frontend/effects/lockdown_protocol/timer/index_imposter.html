<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Among Us Stars</title>
    <link rel="stylesheet" href="./style.css">

</head>

<body>
    <div class="cctv-overlay">
        <div class="scanlines"></div>
        <div class="noise"></div>
    </div>
    <div class="vignette"></div>

    <div class="cctv-header">
        <div class="rec">
            <span class="rec-dot"></span>
            REC
        </div>
        <div class="cam-id">CAM-07</div>
    </div>

    <header class="header">
        <img src="logo.png" alt="Logo" class="logo">
    </header>

    <div class="content">
        <div class="role" id="role"></div>
        <div class="countdown" id="countdown"></div>
    </div>

    <div class="cctv-footer">
        <div class="timestamp" id="timestamp"></div>
        <div class="location">SKELD // SECURITY</div>
    </div>

    <script src="./script_imposter.js"></script>

</body>

</html>

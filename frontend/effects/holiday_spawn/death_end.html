<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Dead World Fade Out</title>
    <style>
        /* FX слой мёртвого мира */
        #deathOverlay {
            position: fixed;
            inset: 0;
            background-color: rgba(80, 80, 100, 0.4);
            pointer-events: none;
            z-index: 99999;
            transition: opacity 2s ease;
        }

        /* Кино-полосы */
        .cine-bar {
            position: fixed;
            width: 100%;
            height: 8vh;
            left: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 100000;
            transition: opacity 2s ease;
        }

        .cine-bar.top {
            top: 0;
        }

        .cine-bar.bottom {
            bottom: 0;
        }
    </style>
</head>

<body>

    <div id="deathOverlay"></div>
    <div class="cine-bar top"></div>
    <div class="cine-bar bottom"></div>

    <script>
        // Функция плавного выхода из эффекта мертвого мира
        function fadeOutDeadWorld() {
            const overlay = document.getElementById('deathOverlay');
            const bars = document.querySelectorAll('.cine-bar');

            // плавное исчезание
            overlay.style.opacity = '0';
            bars.forEach(bar => bar.style.opacity = '0');

            // удаляем через 1 секунду после начала анимации
            setTimeout(() => {
                if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
                bars.forEach(bar => {
                    if (bar.parentNode) bar.parentNode.removeChild(bar);
                });
            }, 1000);
        }

        // Пример вызова через 1 секунду после загрузки
        setTimeout(fadeOutDeadWorld, 1000);
    </script>

</body>

</html>
